<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notas - Instituto American Land</title>
  <link rel="icon" type="image/png" href="../assets/img/Logo.png" />
  <link rel="stylesheet" href="../assets/css/notas.css" />
  <link rel="stylesheet" href="../assets/css/menu_movil.css">
  <link rel="stylesheet" href="../assets/css/portal_comun.css" />
  <link rel="stylesheet" href="../assets/css/comunicaciones.css" />
</head>
<body>

  <!-- ===== NAVBAR ===== -->
  <header>
    <nav>
      <div class="nav-perfil">
        <div class="nav-avatar" id="nav-avatar">E</div>
        <div class="nav-info">
          <span class="nav-nombre" id="nav-nombre">Estudiante</span>
          <span class="nav-rol">Estudiante</span>
        </div>
      </div>

      <ul class="nav-links">
        <li><a href="inicio.html">Inicio</a></li>
        <li><a href="salon_virtual.html">Salón Virtual</a></li>
        <li><a href="horario.html">Horario</a></li>
        <li><a href="tareas.html">Tareas</a></li>
        <li><a href="notas.html" class="activo">Notas</a></li>
      </ul>

      <div class="nav-acciones">
        <a href="../auth/login.html" class="btn-nav-icon btn-cerrar" title="Cerrar sesión">&#8594;&#124;</a>
      </div>
    </nav>
  </header>

  <!-- ===== LAYOUT ===== -->
  <div class="layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">
      <section class="sidebar-seccion">
        <h3>Mis Clases</h3>
        <ul>
          <li class="clase-item">
            <span class="clase-dot"></span>
            <a href="salon_virtual.html">Cargando...</a>
          </li>
        </ul>
      </section>
      <section class="sidebar-seccion">
        <h3>Accesos Rápidos</h3>
        <ul>
          <li><a href="salon_virtual.html" class="acceso-link"><span>&#128187;</span> Entrar al salón</a></li>
          <li><a href="tareas.html"        class="acceso-link"><span>&#128203;</span> Mis Tareas</a></li>
          <li><a href="notas.html"         class="acceso-link"><span>&#9733;</span> Ver Notas</a></li>
        </ul>
      </section>
    </aside>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="contenido">

      <!-- Encabezado -->
      <div class="encabezado-pagina">
        <div>
          <h1>Notas</h1>
          <p id="texto-subtitulo"></p>
        </div>
        <div class="promedio-general">
          <span class="promedio-label">Promedio General</span>
          <span class="promedio-valor" id="promedio-general">—</span>
          <span class="promedio-sub">Sobre 5.0</span>
        </div>
      </div>

      <!-- TARJETAS DE CICLOS -->
      <section class="grid-ciclos" id="grid-ciclos">
        <!-- Lo llena notas.js con los datos de la API -->
      </section>

      <!-- HISTORIAL COMPLETO -->
      <section class="card-seccion">
        <div class="card-header">
          <h2>Historial Completo</h2>
          <!-- Filtro por ciclo -->
          <div class="filtro-wrap">
            <button class="btn-filtro activo" data-ciclo="todos">Todos</button>
            <button class="btn-filtro" data-ciclo="1">Ciclo 1</button>
            <button class="btn-filtro" data-ciclo="2">Ciclo 2</button>
            <button class="btn-filtro" data-ciclo="3">Ciclo 3</button>
            <button class="btn-filtro" data-ciclo="4">Ciclo 4</button>
          </div>
        </div>

        <table class="tabla-datos" id="tabla-historial">
          <thead>
            <tr>
              <th>Actividad</th>
              <th>Ciclo</th>
              <th>Nota</th>
              <th>Estado</th>
            </tr>
          </thead>
          <tbody id="tbody-historial"></tbody>
        </table>

      </section>

    </main>
  </div>

  <script src="../assets/js/notas.js"></script>
  <script src="../assets/js/comunicaciones.js"></script>
  <script src="../assets/js/menu_movil.js"></script>
</body>
</html>
